[PlayerAim]
; EDF6PlayerAim：玩家步兵（角色）的武器自动指向最近的敌人，全兵种通用。
; 独立插件：只依赖 EDFModLoader，不碰 EDF6VehicleCrew / EDF6AutoTurret 的任何文件。
; 逆向笔记见 docs/player-aim-re.md；改完保存即生效（约 1 秒内，不用重启游戏）。
; 需要 EDF.dll TimeDateStamp 0x678CCB46（当前 Steam 版）：对不上时插件只写一行 REFUSED 就退出，不改游戏。

; 总开关。0 = 什么也不做（只加载钩子并记录日志）
Enabled=1
; 1 = 往 EDF6PlayerAim.log 写日志（PLAYERAIM / PLAYERAIM barrel）。排查问题时才开，平时建议 0
Debug=0

; ---- 瞄准方式 ----
; weapons = 只让枪口/弹道转向敌人（推荐：视角完全由你控制）
; view    = 连玩家瞄准角一起写（屏幕会自己转向敌人）
; both    = 两者都做
Aim=weapons

; ---- 枪口挂钩范围（关系到稳定性）----
; fire = 只挂钩「开火时决定这一枪方向」的那一个调用点（0x698569）。默认，最稳
; all  = 挂钩枪口构造的全部 5 个调用点（0x6904d2/0x6905de/0x69366a/0x694873/0x698569）。
;        效果更"实时"（枪身每帧都转），但实测在关卡结束回到菜单时会崩（EDF.dll+0x978fb0，
;        shared_ptr 重复释放），所以默认不用
; off  = 完全不挂钩（只看目标，不改枪），用于对照排查
Barrel=fire

; ---- 人物模型转向（解决"人不动、子弹拐弯"看着假）----
; 0 = 完全不动模型（只有枪口/弹道转，背影会显得奇怪）
; 0.6 = 模型转到目标方向的大部分（推荐起点）：人物会侧身/转身对着敌人
; 1.0 = 模型完全对准敌人
; 无论多少，模型最多只偏离你的视角 Cone 度；目标超出这个范围时模型不动（避免枪从身体侧面伸出去）
BodyYaw=1.0

; ---- 目标选择 ----
; 只考虑离玩家这么近的敌人（米）
Range=200
; 比这更近的敌人不瞄（贴脸时不瞄，米）
MinDistance=25
; 锁定后一直打同一个目标，直到它死掉或跑出这个距离（米；避免两个敌人之间来回切，建议 ≥ Range）
KeepRange=260
; 目标必须在当前朝向这个角度内（度）：调小 = 只打准星附近的；
; 同时也是「模型/枪口最多偏离视角」的上限
Cone=20
; 1 = 只打视线可达的敌人：用游戏自己的地图射线（只撞地形与建筑）检查玩家到敌人之间有没有遮挡，
; 被挡住的当前目标会被丢掉、改打别的敌人（不会对着墙一直开枪）。0 = 不检查
RequireLineOfSight=1

; ---- 仅 Aim=view 时使用 ----
; 每帧走多少：1 = 当帧直接对准（很硬）；0.35 = 平滑跟过去
Gain=0.35

; ---- 标定探针（正常玩不要动）----
; 每帧给某个候选字段加这么多弧度，0 = 不加
Test=0
; 0 = human+0x1230(俯仰) 1 = +0x1234(偏航) 2 = +0x12d8 3 = +0x12dc
TestAxis=0

ConeGraceMs=600
BodyPitch=1.0
SlewMs=700

; ---- 运行中校准（保存 ini 约 1 秒生效，不用重启游戏）----
; 给人物模型额外叠加的俯仰 / 偏航补偿，单位是弧度（1 弧度 ≈ 57.3°）。
; PitchBias 正 = 武器额外上抬；YawBias 正 = 武器额外右转。
; BiasRamp 非 0 时，补偿量在 ±BiasRamp 之间做三角波扫描（弧度/秒），配合 Debug=1 打印的
; `PLAYERAIM bias=` 行，一次游戏会话就能扫出正确的补偿量：看到武器正好指向敌人时，把那一刻的
; bias 值填进 PitchBias，再把 BiasRamp 设回 0。
PitchBias=0.0
YawBias=0.0
BiasRamp=0.0

BodySmoothMs=250